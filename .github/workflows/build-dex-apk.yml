name: Build DeX APK

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/24.0.8215888"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/winlator-dex-${GITHUB_REF_NAME}.apk"

      - name: Upload APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: app/build/outputs/apk/debug/winlator-dex-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-dex-apk
          path: app/build/outputs/apk/debug/*.apk
